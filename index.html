<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Finanzas"><meta name="theme-color" content="#0f172a">
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.json"><title>Finanzas</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px -apple-system,system-ui,sans-serif;background:#f1f5f9;color:#0f172a;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:#0f172a;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;gap:8px;align-items:center}
header select{flex:1;font-size:17px;padding:10px;border-radius:10px;border:0}
header button{background:#334155;color:#fff}
main{padding:12px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
h2{font-size:18px;margin:0 0 10px;display:flex;justify-content:space-between}
.row{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #eef2f6}
.row:last-child{border:0}.row .n{flex:1;min-width:0}.row input{width:110px}
input,select,button{font-size:16px;min-height:44px;border-radius:10px;border:1px solid #cbd5e1;padding:8px 10px;background:#fff}
input.name{width:100%}
button{background:#2563eb;color:#fff;border:0;font-weight:600}
button.sec{background:#e2e8f0;color:#0f172a}button.del{background:#fee2e2;color:#b91c1c;min-width:44px}button.add,button.rm{min-width:44px;font-size:28px;line-height:1;padding:0 12px;font-weight:700}button.add{background:#2563eb;color:#fff}button.rm{background:#dc2626;color:#fff}h2>span{display:flex;gap:6px;align-items:center}
.tot{display:flex;justify-content:space-between;font-weight:700;padding-top:8px}
.big{font-size:26px;font-weight:800}.pos{color:#15803d}.neg{color:#b91c1c}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #e2e8f0;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;color:#64748b;border-radius:0;min-height:60px;font-size:11px}
nav button.on{color:#2563eb}nav b{display:block;font-size:22px}
.muted{color:#64748b;font-size:11px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{min-height:40px;padding:6px 12px;border-radius:20px;background:#e2e8f0;color:#0f172a}.chip.on{background:#2563eb;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid input,.grid select{width:100%}
.p{border-left:4px solid #2563eb;padding:8px 10px;margin:8px 0;background:#f8fafc;border-radius:8px}
dialog{max-height:calc(100dvh - 40px);overflow-y:auto;border:0;border-radius:16px;width:94%;max-width:500px;padding:16px}
#fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:31px;font-size:34px;line-height:1;padding:0;box-shadow:0 6px 16px #2563eb66;z-index:6}
.hero{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff}.hero .muted{color:#cbd5e1}.xl{font-size:40px}.hero .pos{color:#4ade80}
.bar{margin:10px 0}.bl{display:flex;justify-content:space-between;font-size:15px}.bt{background:#e2e8f0;border-radius:6px;height:12px;margin-top:4px}.bt div{background:#2563eb;height:12px;border-radius:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;z-index:9}
main{padding-bottom:90px}
body.locked header,body.locked nav,body.locked #fab,body.locked main{display:none}
#lock{position:fixed;inset:0;z-index:50;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
.lk{width:100%;max-width:340px;text-align:center}.dots{display:flex;gap:14px;justify-content:center;margin:18px 0 8px}
.dots span{width:16px;height:16px;border-radius:8px;border:2px solid #94a3b8}.dots span.on{background:#fff;border-color:#fff}.dots span.opt{opacity:.45}
.lmsg{min-height:22px;color:#fca5a5;font-size:14px;margin-bottom:10px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;justify-items:center}
.key{width:76px;height:76px;border-radius:38px;background:#1e293b;color:#fff;font-size:28px;font-weight:500}.key:active{background:#334155}.key.ok{background:#2563eb;font-size:20px}.key.fn{font-size:24px}.key:disabled{opacity:.35}
.lnk{background:none;color:#93c5fd;margin-top:18px;font-weight:500}
.pay{min-width:72px;padding:6px 8px;font-size:14px;background:#15803d}.pay:disabled{background:#cbd5e1;color:#64748b}
.row .adj{padding:6px 7px;font-size:12px;flex:none}.row .amt.ro{flex:none;min-width:64px!important;font-size:14px}.row input.name.n{min-width:78px}.row .pay{flex:none}
.row .tcat{flex:none;width:30px;min-height:30px;padding:0;background:none;font-size:18px;border:0}
</style></head><body>
<header><select id="msel"></select><button id="newm">+ Mes</button></header>
<main id="v"></main>
<nav><button data-t="ini" class="on" data-l="Hoy"><b>🏠</b>Hoy</button><button data-t="mov" data-l="Movimientos"><b>📝</b>Movimientos</button><button data-t="res" data-l="Mes"><b>📅</b>Mes</button><button data-t="rep" data-l="Reportes"><b>📈</b>Reportes</button></nav>
<button id="fab" aria-label="Nuevo gasto">+</button>
<dialog id="dlg"></dialog>
<script src="app.js"></script>
<script src="extra.js"></script>
<script src="ui2.js"></script>
<script src="mig.js"></script>
<script src="items.js"></script><script src="hist.js"></script><script src="share.js"></script><script src="chk.js"></script><script src="pcat.js"></script><script src="items2.js"></script><script src="tax.js"></script><script src="msg2.js"></script><script src="links.js"></script><script src="inbox.js"></script><script src="scan.js"></script><script src="hoy.js"></script><script src="ops.js"></script><script src="v80.js"></script><script src="v81.js"></script><script src="v86.js"></script><script src="v87.js"></script><script src="v89.js"></script><script src="v90.js"></script><script src="pdfview.js"></script><script src="v91.js"></script><script src="v92.js"></script><script src="v93.js"></script><script src="v94.js"></script>
<script src="nav.js"></script>
<script src="firebase-config.js"></script>
<script type="module" src="sync.js"></script></body></html>
